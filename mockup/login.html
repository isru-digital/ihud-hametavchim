<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>מרכז הרעיונות · כניסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img class="logo-big" src="../LOGO.png" alt="איחוד המתווכים, רשת התיווך הארצית">
    <h1>מרכז הרעיונות</h1>
    <div class="sub">המערכת הפנימית של איחוד המתווכים</div>

    <label class="login-label">מי נכנס?</label>
    <div class="users">
      <button class="user-pick selected">
        <span class="avatar u-itzik">I</span>
        איציק
      </button>
      <button class="user-pick">
        <span class="avatar u-ariel">A</span>
        אריאל
      </button>
      <button class="user-pick">
        <span class="avatar u-ofek">O</span>
        אופק
      </button>
    </div>

    <div class="pass">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" placeholder="סיסמה אישית" aria-label="סיסמה אישית">
    </div>

    <button class="login-btn">
      כניסה למערכת
      <svg class="icon sm" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>

    <div class="login-note">הכניסה נשמרת במכשיר. המערכת פרטית לשלושת השותפים בלבד.</div>
  </div>
</div>

<footer>נבנה על ידי <b>ISRU-E איציק עוזיאל</b></footer>
</body>
</html>
